<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Homework</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css?v=220">
<script>
  // Start-up watchdog: if the app's code can't load or crashes, say why on screen
  // instead of showing a page whose buttons silently do nothing.
  (function () {
    var problems = [];
    function show() {
      if (window.__hwBooted && !problems.length) return;
      var box = document.getElementById('bootError');
      if (!box) {
        box = document.createElement('div');
        box.id = 'bootError';
        box.style.cssText = 'position:fixed;left:10px;right:10px;top:70px;z-index:99;background:#fee2e2;color:#7f1d1d;border-radius:14px;padding:14px 16px;font:15px/1.45 -apple-system,Helvetica,Arial,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.2);max-height:75vh;overflow:auto';
        document.body.appendChild(box);
      }
      var tips = [];
      if (location.protocol === 'file:') tips.push('You opened the file directly. Open your https://…github.io/… address instead.');
      tips.push('On GitHub, check that the repository shows the folders <b>js</b> and <b>vendor</b>, not just index.html and style.css. Folders must be dragged onto the upload page (the "choose your files" button skips them).');
      tips.push('Check: <a href="js/app.js">js/app.js</a> should open a page of code.');
      box.innerHTML = (window.__hwBooted ? '<b>Some of the app\'s files are missing</b> (it runs, but question images or PDFs may fail).<br>'
                                         : '<b>The app couldn\'t start.</b><br>') +
        (problems.length ? '<div style="margin:8px 0;font-family:ui-monospace,Menlo,monospace;font-size:12px;white-space:pre-wrap">' +
          problems.slice(0, 6).join('\n').replace(/</g, '&lt;') + '</div>' : '') +
        '<ul style="padding-left:18px;margin:6px 0">' + tips.map(function (t) { return '<li>' + t + '</li>'; }).join('') + '</ul>' +
        '<div style="font-size:13px">Send a screenshot of this box if it keeps happening.</div>';
    }
    window.addEventListener('error', function (e) {
      var t = e.target;
      if (t && t !== window && (t.src || t.href)) problems.push('Could not load ' + (t.src || t.href));
      else problems.push((e.message || 'Error') + (e.filename ? ' (' + e.filename.split('/').pop() + ':' + e.lineno + ')' : ''));
      if (!window.__hwBooted) show();
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      problems.push('Promise: ' + (e.reason && (e.reason.message || e.reason)));
      if (!window.__hwBooted) show();
    });
    window.__hwBootCheck = show;
    setTimeout(function () { if (!window.__hwBooted) show(); }, 6000);
  })();
</script>
<script>
  // MathJax renders math in questions and hints to SVG (no web fonts needed).
  window.MathJax = {
    startup: { typeset: false },
    svg: { fontCache: 'none' },
    tex: { packages: { '[+]': ['ams'] } },
  };
</script>
<script src="vendor/tex-svg.js" defer></script>
<script src="vendor/pdf-lib.min.js" defer></script>
<script type="module" src="js/app.js?v=220"></script>
</head>
<body>
  <header id="topbar">
    <div class="brand">Homework</div>
    <button id="tabletChip" class="chip">Connect tablet</button>
    <button id="syncBtn" class="iconbtn" title="Sync with tablet" aria-label="Sync with tablet">
      <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 4V1L8 5l4 4V6a6 6 0 0 1 6 6 6 6 0 0 1-.7 2.8l1.5 1.5A8 8 0 0 0 20 12a8 8 0 0 0-8-8zm-6.3 3.2L4.2 5.7A8 8 0 0 0 4 12a8 8 0 0 0 8 8v3l4-4-4-4v3a6 6 0 0 1-6-6c0-1 .3-2 .7-2.8z"/></svg>
    </button>
  </header>
  <div id="syncbar" hidden><div id="syncbarFill"></div><span id="syncbarText"></span></div>
  <main id="view"></main>
  <nav id="tabs">
    <button data-tab="list" class="active"><span>📚</span>Homework</button>
    <button data-tab="canvas"><span>📅</span>Canvas</button>
    <button data-tab="settings"><span>⚙️</span>Settings</button>
  </nav>
  <div id="toast" hidden></div>
  <div id="sheet" hidden><div class="sheet-card"></div></div>
  <input type="file" id="pickFiles" accept="image/*,application/pdf" multiple hidden>
  <input type="file" id="pickCamera" accept="image/*" capture="environment" hidden>
</body>
</html>
